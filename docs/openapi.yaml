openapi: 3.0.3
info:
  title: Go Todo API
  description: A lightweight RESTful Todo API built with Go, Gin, and MongoDB.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Todos
    description: Operations related to Todo items
  - name: Health
    description: Service health check

paths:
  /api/todos:
    get:
      tags: [Todos]
      summary: List all todos
      operationId: listTodos
      responses:
        "200":
          description: A list of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      tags: [Todos]
      summary: Create a new todo
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoInput"
      responses:
        "201":
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A todo with this title already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: MongoDB ObjectID of the todo
        schema:
          type: string
          example: "660d2c1f9a1e4a1a2c8b4567"
    get:
      tags: [Todos]
      summary: Get a todo by ID
      operationId: getTodo
      responses:
        "200":
          description: The requested todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Todos]
      summary: Update an existing todo
      operationId: updateTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoInput"
      responses:
        "200":
          description: Todo updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Todo updated successfully
        "400":
          description: Invalid ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Todos]
      summary: Delete a todo by ID
      operationId: deleteTodo
      responses:
        "204":
          description: Todo deleted successfully
        "400":
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/healthchecker:
    get:
      tags: [Health]
      summary: Check API health
      operationId: healthCheck
      responses:
        "200":
          description: API is up and running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: API is running

components:
  schemas:
    Todo:
      type: object
      properties:
        id:
          type: string
          example: "660d2c1f9a1e4a1a2c8b4567"
        title:
          type: string
          example: Buy groceries
        content:
          type: string
          example: Milk, eggs, bread, and coffee
        completed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TodoInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: Buy groceries
        content:
          type: string
          example: Milk, eggs, bread, and coffee
        completed:
          type: boolean
          example: false
    Error:
      type: object
      properties:
        error:
          type: string
          example: Todo not found
